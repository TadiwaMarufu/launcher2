name: Build EmoLauncher Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -storepass emolauncher \
            -alias emolauncher \
            -keypass emolauncher \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=EmoLauncher,O=EmoLauncher,C=ZW"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: emolauncher
          KEY_PASSWORD: emolauncher
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/*.apk \
             app/build/outputs/apk/release/EmoLauncher-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EmoLauncher-release
          path: app/build/outputs/apk/release/EmoLauncher-release.apk
          if-no-files-found: error
